name: Keep Backend Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ping Backend Health Endpoint
      run: |
        echo "🏓 Pinging backend to keep it alive..."
        echo "⏰ Current time: $(date)"
        
        # Ping the main backend health endpoint
        echo "📡 Testing health endpoint..."
        health_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gwoc-lovat.vercel.app/health)
        
        if [ $health_response -eq 200 ]; then
          echo "✅ Health endpoint is alive! (HTTP $health_response)"
        else
          echo "❌ Health endpoint returned HTTP $health_response"
        fi
        
        # Also ping the root endpoint
        echo "📡 Testing root endpoint..."
        root_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gwoc-lovat.vercel.app/)
        
        if [ $root_response -eq 200 ]; then
          echo "✅ Root endpoint is alive! (HTTP $root_response)"
        else
          echo "⚠️ Root endpoint returned HTTP $root_response"
        fi
        
        # Get detailed health information
        echo "📊 Getting detailed health info..."
        health_data=$(curl -s --max-time 30 https://gwoc-lovat.vercel.app/health || echo "Failed to get health data")
        echo "Health data: $health_data"
        
        echo "🎉 Keep-alive ping completed successfully!"

    - name: Wake Up Render Keep-Alive Service
      run: |
        echo "🔄 Waking up Render keep-alive service..."
        
        # Ping the Render service to wake it up if sleeping
        render_response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gwoc-duplicate.onrender.com/ || echo "000")
        
        if [ $render_response -eq 200 ]; then
          echo "✅ Render keep-alive service is awake! (HTTP $render_response)"
        else
          echo "⚠️ Render keep-alive service returned HTTP $render_response (might be sleeping)"
        fi
        
        echo "🔄 Keep-alive service wake-up completed!"

    - name: Summary
      run: |
        echo "📋 Summary:"
        echo "✅ Backend health check completed"
        echo "✅ Render service wake-up attempted"
        echo "⏰ Next run in 5 minutes"
        echo "🎯 This ensures your backend stays warm 24/7!"