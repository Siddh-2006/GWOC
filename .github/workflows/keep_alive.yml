name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent 15-min inactivity sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping_job:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node.js Backend (Vercel)
        run: |
          # Replace with your actual Vercel URL
          curl -I https://gwoc-t7pn.vercel.app/health || echo "Node.js Ping Failed"
          
      - name: Ping Chatbot (Render)
        run: |
          # Replace with your actual Render URL
          curl -I https://mindsettler-chatbot-latest.onrender.com/health || echo "Chatbot Ping Failed"
